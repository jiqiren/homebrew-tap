# When brew test-bot completes successfully on a Dependabot PR, merge it through
# GitHub so it is recorded as a merged PR. Without this, publish.yml's brew
# pr-pull pushes the branch straight to main, which auto-closes the PR without a
# merge record.
name: dependabot auto-merge

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')
          if [[ -z "$pr_number" ]]; then
            echo "No open PR found for branch ${HEAD_BRANCH}" >&2
            exit 1
          fi
          gh pr merge --repo "$GITHUB_REPOSITORY" --rebase --delete-branch "$pr_number"
