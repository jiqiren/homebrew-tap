# Builds bottles on push to main (via tests.yml), then merges and publishes them.
name: brew pr-pull

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@fd832223f0244dd20658680e5d4aca049 # 2026.08.03.2

      - name: Download bottle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: bottles_*
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=$(brew ruby -e 'puts Formula["cli-toot"].version')" >> "$GITHUB_OUTPUT"

      - name: Merge bottles into formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
        run: |
          tag="cli-toot-${{ steps.version.outputs.version }}"
          brew bottle --merge --write --root-url="https://github.com/${{ github.repository }}/releases/download/${tag}" ./*.bottle.json

      - name: Upload bottles to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="cli-toot-${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.bottle.tar.gz --clobber
          else
            gh release create "$tag" --title="cli-toot ${{ steps.version.outputs.version }}" --generate-notes ./*.bottle.tar.gz
          fi

      - name: Push commits
        uses: Homebrew/actions/git-try-push@fd832223f0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          branch: main
