# When test-bot completes successfully on a PR, pulls the PR's bottles, merges
# them into the formula, uploads to a GitHub release, and pushes (which auto-closes the PR).
name: brew pr-pull

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2

      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${{ github.event.workflow_run.head_branch }}" --state open --json number --jq '.[0].number')
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          PULL_REQUEST: ${{ steps.pr.outputs.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Get version
        id: version
        run: echo "version=$(brew ruby -e 'puts Formula["cli-toot"].version')" >> "$GITHUB_OUTPUT"

      - name: Upload bottles to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="cli-toot-${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.bottle.tar.gz --clobber
          else
            gh release create "$tag" --title="cli-toot ${{ steps.version.outputs.version }}" --generate-notes ./*.bottle.tar.gz
          fi

      - name: Push commits
        uses: Homebrew/actions/git-try-push@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          branch: main
